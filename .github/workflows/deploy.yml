name: Deployment

on:
  release:
    types: [ published ]

jobs:
  generate-portable-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: maven
      - name: Parse version tag
        id: parse-tag
        run: |
          TAG=${{ github.event.release.tag_name }}
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Building and packaging
        run: mvn compile package
      - name: Generate portable archive
        run: |
          cd jarmemu-distribution/target || exit 1
          zip -r JArmEmu-${{ steps.parse-tag.outputs.version }}.zip ./jarmemu/
      - name: Compute SHA256 checksum
        id: sha256
        run: |
          cd jarmemu-distribution/target || exit 1
          echo "sum=$(sha256sum JArmEmu-${{ steps.parse-tag.outputs.version }}.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          file: 'jarmemu-distribution/target/JArmEmu-${{ steps.parse-tag.outputs.version }}.zip'
    outputs:
      version: ${{ steps.parse-tag.outputs.version }}
      sum: ${{ steps.sha256.outputs.sum }}

  deploy-to-aur:
    if: false
    runs-on: ubuntu-latest
    needs: generate-portable-archive
    steps:
      - name: Clone packaging repository
        uses: GuillaumeFalourd/clone-github-repo-action@main
        with:
          owner: 'Dwight-Studio'
          repository: 'JArmEmu-Packages'
      - name: Generate PKGBUILD
        run: |
          cd JArmEmu-Packages/arch || exit 1
          VERSION=${{ needs.generate-portable-archive.outputs.version }} SUM=${{ needs.generate-portable-archive.outputs.sum }} envsubst '${VERSION} ${SUM}' < PKGBUILD_template > PKGBUILD
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          pkgbuild: JArmEmu-Packages/arch/PKGBUILD
          pkgname: 'jarmemu'
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to v${{needs.generate-portable-archive.outputs.version}}

  build-deb:
    runs-on: ubuntu-22.04
    needs: generate-portable-archive
    if: ${{ always() && (needs.generate-portable-archive.result == 'success' || github.event_name == 'workflow_dispatch') }}
    env:
      VERSION: ${{ needs.generate-portable-archive.outputs.version || inputs.version }}
      SUM: ${{ needs.generate-portable-archive.outputs.sum }}
    steps:
      - name: Compute checksum of the released archive (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          wget -q https://github.com/Dwight-Studio/JArmEmu/releases/download/v${VERSION}/JArmEmu-${VERSION}.zip
          echo "SUM=$(sha256sum JArmEmu-${VERSION}.zip | awk '{print $1}')" >> "$GITHUB_ENV"
      - name: Clone packaging repository
        uses: GuillaumeFalourd/clone-github-repo-action@main
        with:
          owner: 'Dwight-Studio'
          repository: 'JArmEmu-Packages'
      - name: Generate control files
        run: |
          cd JArmEmu-Packages/deb/jarmemu_template || exit 1
          FILES=$(find "debian" -type f)
          cd .. || exit 1
          mkdir -p jarmemu/debian
          for file in $FILES; do
            VERSION=$VERSION SUM=$SUM DATE=$(date -R) envsubst '${VERSION} ${SUM} ${DATE}' < jarmemu_template/$file > jarmemu/$file
          done
      - name: Build package
        run: |
          cd JArmEmu-Packages/deb/jarmemu || exit 1
          sudo apt install -y desktop-file-utils debhelper
          dpkg-buildpackage -b -us -uc
      - name: Publish to RepoManager
        env:
          RM: ${{ secrets.REPOMANAGER_URL }}/api/v2
          KEY: ${{ secrets.REPOMANAGER_API_KEY }}
        run: |
          api() { curl --fail-with-body -L -s --post301 -H "Authorization: Bearer $KEY" "$@"; }
          wait_task() {
            for _ in $(seq 1 60); do
              RES=$(api -X GET "$RM/task/$1/")
              echo "$RES"
              case "$(echo "$RES" | jq -r '.results.Status // empty' | tr '[:upper:]' '[:lower:]')" in
                done|completed|success) return 0 ;;
                error|failed) return 1 ;;
              esac
              sleep 5
            done
            return 1
          }

          REPO=$(api -X GET "$RM/repo/" | jq -r '.results[] | select(.Name == "dwightstudio-stable" and .Dist == "any" and .Section == "main") | .Id' | head -n1)
          [ -n "$REPO" ] || { echo "Repository not found"; exit 1; }
          SNAP=$(api -X GET "$RM/repo/$REPO/" | jq -r '.results[].Id' | head -n1)
          [ -n "$SNAP" ] || { echo "Snapshot not found"; exit 1; }

          api -X POST -F "file1=@JArmEmu-Packages/deb/jarmemu_${VERSION}-1_all.deb" -F "overwrite=true" "$RM/snapshot/$SNAP/upload"

          # Rebuild and sign the repository metadata
          RES=$(api -X PUT -H "Content-Type: application/json" -d '{"gpgSign":"true"}' "$RM/snapshot/$SNAP/rebuild")
          echo "$RES"
          TASK=$(echo "$RES" | jq -r '."task-id" // .task_id // empty')
          [ -z "$TASK" ] || wait_task "$TASK"
      - name: Download signed package
        run: |
          BASE=https://deb.dwightstudio.fr/repo/deb/dwightstudio-stable/any/main/prod
          for _ in $(seq 1 10); do
            FILENAME=$(curl -fsL "$BASE/dists/any/main/binary-all/Packages" | awk -v v="${VERSION}-1" '/^Package: jarmemu$/{p=1} p&&/^Version:/{ok=($2==v)} p&&/^Filename:/{f=$2} /^$/{if(p&&ok){print f; exit} p=0; ok=0}')
            [ -n "$FILENAME" ] && break
            sleep 10
          done
          [ -n "$FILENAME" ] || { echo "Package not found in repository"; exit 1; }
          wget -O "jarmemu_${VERSION}-1_all.deb" "$BASE/$FILENAME"
      - name: Upload to release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          file: 'jarmemu_${{ env.VERSION }}-1_all.deb'
          tag: v${{ env.VERSION }}

  build-win:
    runs-on: ubuntu-22.04
    needs: generate-portable-archive
    steps:
      - name: Clone packaging repository
        uses: GuillaumeFalourd/clone-github-repo-action@main
        with:
          owner: 'Dwight-Studio'
          repository: 'JArmEmu-Packages'
      - name: Generate control files
        run: |
          cd JArmEmu-Packages/win/innosetup_template || exit 1
          FILES=$(find "./" -type f)
          cd .. || exit 1
          mkdir -p innosetup/build
          for file in $FILES; do
            VERSION=${{ needs.generate-portable-archive.outputs.version }} SUM=${{ needs.generate-portable-archive.outputs.sum }} envsubst '${VERSION} ${SUM}' < innosetup_template/$file > innosetup/$file
          done
          chmod -R a+w innosetup
          umask a+w
      - name: Download portable archive
        env:
          VERSION: ${{ needs.generate-portable-archive.outputs.version }}
        run: |
          cd JArmEmu-Packages/win/innosetup/build || exit 1
          wget https://github.com/Dwight-Studio/JArmEmu/releases/download/v${VERSION}/JArmEmu-${VERSION}.zip
          unzip JArmEmu-${VERSION}.zip
      - name: Build installer
        uses: tj-actions/docker-run@v2.2.1
        with:
          image: 'amake/innosetup:innosetup6-buster'
          name: 'inno'
          options: --rm -i --security-opt seccomp=unconfined -v "${{ github.workspace }}/JArmEmu-Packages/win/innosetup:/jarmemu"
          args: /V Z:/jarmemu/jarmemu.iss
      - name: Compute SHA256 checksum
        id: sha256
        run: |
          cd JArmEmu-Packages/win/innosetup || exit 1
          echo "sum=$(sha256sum JArmEmu-${{ needs.generate-portable-archive.outputs.version }}-1.exe | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload to release
        uses: svenstaro/upload-release-action@2.9.0
        with:
          file: 'JArmEmu-Packages/win/innosetup/JArmEmu-${{ needs.generate-portable-archive.outputs.version }}-1.exe'
    outputs:
      version: ${{ needs.generate-portable-archive.outputs.version }}
      sum: ${{ steps.sha256.outputs.sum }}

  deploy-to-chocolatey:
    runs-on: ubuntu-latest
    needs: [ build-win ]
    steps:
      - name: Clone packaging repository
        uses: GuillaumeFalourd/clone-github-repo-action@main
        with:
          owner: 'Dwight-Studio'
          repository: 'JArmEmu-Packages'
      - name: Generate control files
        run: |
          cd JArmEmu-Packages/win/chocolatey_template || exit 1
          FILES=$(find "./" -type f)
          cd .. || exit 1
          mkdir -p chocolatey/tools
          for file in $FILES; do
            VERSION=${{ needs.build-win.outputs.version }} SUM="${{ needs.build-win.outputs.sum }}" envsubst '${VERSION} ${SUM}' < chocolatey_template/$file > chocolatey/$file
          done
      - name: Build package
        uses: crazy-max/ghaction-chocolatey@v3.0.0
        with:
          args: pack JArmEmu-Packages/win/chocolatey/jarmemu.nuspec --out .
      - name: Push package
        uses: crazy-max/ghaction-chocolatey@v3.0.0
        with:
          args: push jarmemu.${{ needs.build-win.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}

  deploy-to-copr:
    runs-on: ubuntu-latest
    needs: [ generate-portable-archive ]
    steps:
      - name: Post to Copr webhook
        run: curl -X POST --data "${{ needs.generate-portable-archive.outputs.version }}" ${{ secrets.COPR_WEBHOOK_URL }}

  deploy-to-flathub:
    if: false
    runs-on: ubuntu-latest
    needs: [ generate-portable-archive ]
    steps:
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: flathub/fr.dwightstudio.JArmEmu
          event-type: new-release
          client-payload: '{"version": "${{ needs.generate-portable-archive.outputs.version }}", "sum": "${{ needs.generate-portable-archive.outputs.sum }}"}'