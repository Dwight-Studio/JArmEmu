name: Validation
run-name: Validation for PR ${{ github.event.number }}

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'oracle'
        cache: maven
    - name: Check project version has not been released yet
      run: |
        version=$(mvn -q -N help:evaluate -Dexpression=project.version -DforceStdout)
        echo "Project version: $version"
        if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
          echo "::error::Version $version has already been released (tag v$version exists). Bump <revision> in pom.xml."
          exit 1
        fi

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'oracle'
          cache: maven
      - name: Run tests
        run: mvn compile test